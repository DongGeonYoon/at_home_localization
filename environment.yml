# Python environment for the localization nodes and tools:
#   PYTHONNOUSERSITE=1 mamba env create -f environment.yml
# ROS 2 Humble itself comes from apt (/opt/ros/humble); this env only adds
# the python packages its nodes import, on the same python minor (3.10) so
# that rclpy and the message packages load in it.
name: at_home_localization
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # global_localization.py exits on import with numpy 2 (ros2_numpy,
      # open3d); ros2_numpy 0.0.5 itself pins 1.24.2.
      - numpy==1.24.2
      - open3d==0.19.0
      - ros2_numpy==0.0.5
      # tf_transformations imports transforms3d, which is not on this env's
      # path; 0.4.2 works with numpy 1.24 (Ubuntu's 0.3.1 uses np.float).
      - transforms3d==0.4.2
      - pyyaml==6.0.3
      # tools/pcd_to_map.py
      - opencv-python-headless==4.9.0.80
      - pillow
variables:
  # ~/.local packages (another numpy / open3d) must not shadow these.
  PYTHONNOUSERSITE: "1"
